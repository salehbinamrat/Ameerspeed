name: Portal checks
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal-core:
    name: Portal Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: HTML and file-integrity regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: RouterOS error classifier tests
        run: |
          node tests/error_mapping.test.js
          node tests/deep_regression.test.js
          node tests/high_priority.test.js
      - name: JavaScript syntax checks
        run: for f in js/*.js; do node --check "$f"; done
  portal-browser:
    name: Portal Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Chromium/Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Responsive screen regression
        run: |
          python tests/browser_regression.py
          python tests/browser_login_flow.py
          python tests/full_page_smoke.py
          python tests/priority_browser.py

  portal-package:
    name: Portal Package
    needs: [portal-core, portal-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build verified router and source packages
        run: python scripts/build_portal.py --commit "${{ github.sha }}"
      - name: Verify SHA-256 package digests
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Upload verified RouterOS release and source
        uses: actions/upload-artifact@v4
        with:
          name: Ameerspeed-Portal-${{ github.run_number }}
          path: |
            dist/Ameerspeed_RouterOS_Portal.zip
            dist/Ameerspeed_Source.zip
            dist/SHA256SUMS
            dist/MANIFEST.json
          if-no-files-found: error
          retention-days: 30
